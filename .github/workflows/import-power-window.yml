name: Import Power Window history
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Move the project into this repository
        shell: bash
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD^)" = 9ee448c4190074e38969842be0b59da4fe92a369
          git fetch --no-tags https://github.com/bakk0u/bakk0u.git f1a0c050f74a2a18dc22bd42196ee20aa35b622c:refs/heads/power-window-import
          FILTER_BRANCH_SQUELCH_WARNING=1 git filter-branch --subdirectory-filter projects/power-window -- power-window-import
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge -s ours --no-commit --allow-unrelated-histories power-window-import
          git archive power-window-import | tar -x --exclude=README.md
          cat > README.md <<'END_DOC'
          # Power Window

          [**Try the interactive demo**](https://bakk0u.github.io/Power-window/)

          Power Window finds the cheapest uninterrupted time to run an appliance or charge an EV. Set the run time, average power and finish time, then select a bar to compare that start with the recommended window.

          The public demo replays quarter-hour wholesale prices for Germany and Luxembourg from 23 November 2026. The deployed Databricks job checks for new or corrected prices every hour. Times are shown in Berlin time, and estimates cover wholesale energy only.

          ## How it works

          ```mermaid
          flowchart TD
              EC["Energy-Charts (SMARD data)"] --> Job["Hourly Databricks Lakeflow Job"]
              Job --> Bronze["Bronze · raw snapshots"]
              Bronze --> Silver["Silver · Delta price intervals"]
              Silver --> Gold["Gold · Databricks SQL views"]
              Gold --> API["Worker price API"]
              EC -->|Direct-feed mode| API
              SMARD["SMARD quarter-hour feed"] -->|Direct-feed fallback| API
              API --> UI["Live planner"]
          ```

          The Worker serves the live planner and `/api/prices`. It can query Databricks SQL or run in direct-feed mode. The planner skips gaps in the price series and compares only consecutive quarter-hours.

          ## Inside the lakehouse

          - [**Job configuration**](lakehouse/databricks.yml) defines the hourly Lakeflow Job, schedule, and retries.
          - [**Ingestion**](lakehouse/src/refresh.py) archives raw responses in bronze, merges price corrections into silver by UTC delivery interval, and creates the gold views for priced intervals and complete one-hour windows.
          - [**Data quality**](lakehouse/src/market.py) checks units, price values, timestamp alignment and duplicates. The [tests](lakehouse/tests/) cover unpublished prices, Berlin clock changes, and Delta merges.

          ## Run locally

          With Node.js 22 or later, run `npm test` and `npm run dev`, then open [localhost:5173](http://localhost:5173). Direct-feed mode needs no API key. To deploy the job and connect the Worker to the warehouse, see the [Databricks setup guide](lakehouse/README.md).

          Market data from [Bundesnetzagentur | SMARD.de](https://www.smard.de/) via [Fraunhofer ISE Energy-Charts](https://energy-charts.info/) under [CC BY 4.0](https://creativecommons.org/licenses/by/4.0/).
          END_DOC
          cat > lakehouse/README.md <<'END_DOC'
          # Power Window lakehouse

          An hourly Lakeflow Job reads yesterday, today and tomorrow in the Germany/Luxembourg bidding zone. Re-reading overlapping dates picks up published corrections and newly released delivery periods. The source is Bundesnetzagentur | SMARD.de via Fraunhofer ISE Energy-Charts, under CC BY 4.0. Price amounts are wholesale EUR/MWh. A delivery day follows Europe/Berlin time and contains 92, 96 or 100 quarter-hours.

          | Dataset | Key | Purpose |
          | --- | --- | --- |
          | `bronze_snapshots` | Zone and SHA-256 of response bytes | Keep each distinct accepted response, URL, first retrieval time and licence |
          | `silver_prices` | Zone and UTC interval start | Apply price corrections and explicit nulls using Delta MERGE |
          | `gold_market_intervals` | Zone and UTC interval start | Serve priced intervals with exclusive end, local delivery date and last price change time |
          | `gold_hour_windows` | Zone and UTC start of a complete hour | Compute a rolling mean only where four consecutive quarter-hours are priced |

          A failed fetch or invalid payload raises a job error before any writes. A retry after the bronze write can finish the silver merge without duplicating the raw response. Unpublished future periods have no recommendation. Null prices remove a period from the serving view. A missing timestamp in a later partial response leaves the last reported value in the archive. The two gold views read committed silver rows. The job is limited to one concurrent run.

          ## Deploy

          Use an authenticated Databricks CLI with a Unity Catalog workspace, serverless jobs compute and outbound HTTPS access to api.energy-charts.info. Give the job identity USE CATALOG and CREATE SCHEMA on the catalog, or provision the schema and grant USE SCHEMA and CREATE TABLE there. Give a separate serving identity USE CATALOG, USE SCHEMA and SELECT on the gold view, plus CAN USE on its SQL warehouse.

          Run these commands from this directory. The first deployment leaves the recurring schedule paused.

          ```sh
          databricks bundle validate -t prod --var catalog=main,schema=power_window
          databricks bundle deploy -t prod --var catalog=main,schema=power_window
          databricks bundle run -t prod refresh_prices
          ```

          After the first successful run, enable the hourly schedule with `databricks bundle deploy -t prod --var catalog=main,schema=power_window,schedule_state=UNPAUSED`. Preserve those target variable values on later deployments. In the Databricks Jobs run history, check failures and always verify that the next requested delivery period exists before using its price.

          ```sql
          SELECT start_epoch, end_epoch, eur_mwh, observed_at
          FROM main.power_window.gold_market_intervals
          WHERE zone = 'DE-LU'
            AND start_epoch >= unix_timestamp(current_timestamp())
          ORDER BY start_epoch;
          ```

          ## Connect the Worker

          Set these four values in the Worker environment to serve prices from Databricks SQL.

          | Setting | Value |
          | --- | --- |
          | `DBX_HOST` | HTTPS origin of the Databricks workspace |
          | `DBX_WAREHOUSE_ID` | SQL warehouse ID |
          | `DBX_INTERVAL_TABLE` | Fully qualified `gold_market_intervals` view, such as `workspace.power_window.gold_market_intervals` |
          | `DBX_TOKEN` | Server-side secret for an identity with warehouse and view access |

          Without these settings, the Worker uses the direct market feed. With the Databricks settings present, a warehouse error returns an unavailable status.

          ## Verify locally

          ```sh
          python -m unittest discover -s tests -v
          ```

          The parser rejects a mismatched unit or licence, invalid numbers, unaligned timestamps and duplicate source keys. Its tests cover both Berlin clock changes. The integration check below also runs Delta MERGE and both serving views against a temporary Spark SQL warehouse. It needs Java, PySpark 4.0.1, delta-spark 4.0.0 and the matching Delta jars.

          ```sh
          spark-submit --master 'local[2]' --packages io.delta:delta-spark_2.13:4.0.0 tests/check_delta.py
          ```

          [Energy-Charts API](https://api.energy-charts.info/) · [Source licence](https://creativecommons.org/licenses/by/4.0/) · [Databricks bundle examples](https://docs.databricks.com/aws/en/dev-tools/bundles/examples) · [Delta merge](https://docs.databricks.com/aws/en/delta/merge)
          END_DOC
          git rm .github/workflows/import-power-window.yml
          git add -A
          test "$(git write-tree)" = 8b5d626c1afdb715ffd97bcdc403b2909882498a
          git diff --cached --check
          git commit -m "Move Power Window source and history into its own repository"
          git push origin HEAD:main
